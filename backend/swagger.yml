openapi: 3.0.0
info:
  title: DataDesk API
  description: The backend API for DataDesk, the interactive SQL practice and interview platform.
  version: 1.0.0
servers:
  - url: http://localhost:3000
    description: Local development server
paths:
  /api/auth/register:
    post:
      summary: Register a new user
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - email
                - password
              properties:
                username:
                  type: string
                email:
                  type: string
                password:
                  type: string
      responses:
        '201':
          description: Created
        '400':
          description: Bad request
  /api/auth/login:
    post:
      summary: Login
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Success
  /api/submissions:
    post:
      summary: Save a SQL submission
      tags:
        - Submissions
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - questionId
                - sql
                - status
              properties:
                questionId:
                  type: string
                questionTitle:
                  type: string
                sql:
                  type: string
                status:
                  type: string
                  enum: [Accepted, Wrong Answer, Error, Time Limit Exceeded]
                executionTimeMs:
                  type: integer
      responses:
        '201':
          description: Created
        '401':
          description: Unauthorized
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: access_token
